services:
  db:
    image: postgres:17
    container_name: streetdrop_db

    environment:
      POSTGRES_USER: streetdrop
      POSTGRES_PASSWORD: streetdrop_dev
      POSTGRES_DB: streetdrop

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
